<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atelier génératif — galerie et créateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
:root {
  --bg: #10141a;
  --panel: #171d25;
  --panel-alt: #1c232d;
  --text: #e7ecf2;
  --text-dim: #8b95a5;
  --accent: #6fe7c8;
  --accent-warm: #f2a65a;
  --border: #2a3340;
  --radius: 10px;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", monospace;
}

* {
  box-sizing: border-box;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
}

button, input {
  font-family: inherit;
}

/* ---------- Header ---------- */

.app-header {
  padding: 28px clamp(20px, 4vw, 48px) 20px;
  border-bottom: 1px solid var(--border);
}

.wordmark {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--font-display);
}

.wordmark__mark {
  font-size: 28px;
  font-weight: 600;
  color: var(--text);
}

.wordmark__sub {
  font-size: 20px;
  font-weight: 400;
  font-style: italic;
  color: var(--accent);
}

.app-header__tagline {
  margin: 6px 0 0;
  color: var(--text-dim);
  font-size: 14px;
}

/* ---------- Layout ---------- */

.app-grid {
  display: grid;
  grid-template-columns: 220px 1fr 300px;
  gap: 1px;
  background: var(--border);
  min-height: 62vh;
}

@media (max-width: 900px) {
  .app-grid {
    grid-template-columns: 1fr;
  }
}

.rail {
  background: var(--panel);
  padding: 20px;
  overflow-y: auto;
}

.rail__title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 14px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ---------- Preset gallery ---------- */

.preset-gallery {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.preset-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.preset-card:hover {
  border-color: var(--accent);
}

.preset-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.preset-card--active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--panel-alt));
}

.preset-card__swatch {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  flex-shrink: 0;
}

.preset-card__name {
  font-size: 13.5px;
}

/* ---------- Stage ---------- */

.stage {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 14px;
}

.canvas-container {
  flex: 1;
  min-height: 420px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0b0f14;
}

.canvas-container canvas {
  display: block;
}

.stage__actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.stage__actions-right {
  display: flex;
  gap: 10px;
}

.seed-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.seed-readout {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent-warm);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  background: var(--panel-alt);
}

/* ---------- Buttons ---------- */

.button {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.05s ease;
}

.button:hover {
  border-color: var(--accent);
}

.button:active {
  transform: translateY(1px);
}

.button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.button--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b1512;
  font-weight: 600;
}

.button--secondary {
  background: var(--panel-alt);
}

.button--tertiary {
  background: transparent;
  color: var(--text-dim);
}

/* ---------- Controls panel ---------- */

.controls {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.panel-title {
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0;
}

.panel-description {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}

.control-group h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin: 0 0 10px;
}

.control-row {
  margin-bottom: 14px;
}

.control-header {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  margin-bottom: 6px;
  color: var(--text);
}

.control-value {
  font-family: var(--font-mono);
  color: var(--accent-warm);
}

.control-row input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.control-row--color {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.control-row--color input[type="color"] {
  width: 40px;
  height: 26px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: none;
  padding: 0;
  cursor: pointer;
}

/* ---------- Saved variants strip ---------- */

.variants-strip {
  border-top: 1px solid var(--border);
  padding: 20px clamp(20px, 4vw, 48px) 32px;
}

.variants-strip__title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 14px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.saved-variants {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.variants-empty {
  color: var(--text-dim);
  font-size: 13px;
  margin: 0;
}

.variant-card {
  position: relative;
  flex: 0 0 auto;
  width: 140px;
}

.variant-card img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  display: block;
}

.variant-card img:hover {
  border-color: var(--accent);
}

.variant-card__label {
  display: block;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.variant-card__remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: none;
  background: rgba(11, 15, 20, 0.75);
  color: var(--text);
  cursor: pointer;
  line-height: 1;
  font-size: 14px;
}

.variant-card__remove:hover {
  background: var(--accent-warm);
  color: #0b1512;
}

</style>
</head>
<body>
  <header class="app-header">
    <div class="wordmark">
      <span class="wordmark__mark">Atelier</span>
      <span class="wordmark__sub">génératif</span>
    </div>
    <p class="app-header__tagline">Une galerie d'algorithmes, un créateur pour les faire vôtres.</p>
  </header>

  <main class="app-grid">
    <aside class="rail rail--left">
      <h2 class="rail__title">Galerie</h2>
      <div id="preset-gallery" class="preset-gallery"></div>
    </aside>

    <section class="stage">
      <div id="canvas-container" class="canvas-container" aria-label="Zone de rendu de l'animation"></div>
      <div class="stage__actions">
        <div id="seed-controls" class="seed-controls"></div>
        <div class="stage__actions-right">
          <button id="save-variant" type="button" class="button button--accent">Enregistrer dans la galerie</button>
          <button id="download-png" type="button" class="button button--tertiary">Télécharger en PNG</button>
        </div>
      </div>
    </section>

    <aside class="rail rail--right">
      <div id="controls" class="controls"></div>
    </aside>
  </main>

  <footer class="variants-strip">
    <h2 class="variants-strip__title">Variantes enregistrées</h2>
    <div id="saved-variants" class="saved-variants"></div>
  </footer>
